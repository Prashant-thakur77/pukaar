; Pukaar alarm-layer firmware. UNTESTED ON HARDWARE: see firmware/README.md.
;
;   pio test -e native                 host unit tests (no board needed)
;   pio run  -e siren_node -j 2        one device image (build them one at a time)
;   pio run                            every ESP32 image
;
; The ESP32 envs use arduino-esp32 3.x (ESP-IDF 5), as the gauge v2 sketch does. The official
; `espressif32` 6.x platform still ships arduino-esp32 2.x, so the platform is pinned to a
; pioarduino release instead (community-maintained, arduino-esp32 3.3.x on IDF 5.5).

[platformio]
default_envs = siren_node, siren_node_sim, gauge_v3, gauge_v3_sim, rain_node, pradhan_box, lora_relay

[env]
lib_deps =
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -I lib/pukaar_common
  -Wall

; ---------------------------------------------------------------- ESP32-S3 base
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv   ; app0/app1 (OTA rollback) + littlefs
board_upload.flash_size = 8MB
monitor_speed = 115200
lib_deps =
  ${env.lib_deps}
  256dpi/MQTT@2.5.2
build_flags =
  ${env.build_flags}
  -DPUKAAR_ESP32=1
  -DCORE_DEBUG_LEVEL=1

[env:siren_node]
extends = esp32
build_src_filter = +<siren_node/>
build_flags =
  ${esp32.build_flags}
  -DPUKAAR_TRANSPORT_MQTT=1
  -DPUKAAR_AUDIO_DFPLAYER=1
  '-DPUKAAR_FW="pukaar-siren-0.1.0"'

; Wokwi: no modem, no I2S. MQTT, LoRa and SMS become lines on the serial port, the tone is LEDC,
; the INA226 and the mic are modelled in firmware. TEST ONLY keys are compiled in.
[env:siren_node_sim]
extends = esp32
build_src_filter = +<siren_node/>
build_flags =
  ${esp32.build_flags}
  -DPUKAAR_TRANSPORT_SERIAL=1
  -DPUKAAR_AUDIO_LEDC=1
  -DPUKAAR_SIM=1
  '-DPUKAAR_FW="pukaar-siren-0.1.0-sim"'

; The river gauge v3 (spec 3.2, 7.1): deep sleep, a wake on each bucket tip (no ULP program in an
; Arduino build: see src/gauge_v3/main.cpp), E22 LoRa to the downstream sirens, PPP + MQTT.
[env:gauge_v3]
extends = esp32
build_src_filter = +<gauge_v3/>
build_flags =
  ${esp32.build_flags}
  -DPUKAAR_TRANSPORT_MQTT=1
  '-DPUKAAR_FW="pukaar-gauge-3.0.0"'

; Wokwi: no deep sleep, no modem, no radar; the bucket is a pushbutton counted through the ULP's own
; step function every 5 ms; `>STAGE`, `>WAKE` and the rest on the serial port. TEST ONLY keys.
[env:gauge_v3_sim]
extends = esp32
build_src_filter = +<gauge_v3/>
build_flags =
  ${esp32.build_flags}
  -DPUKAAR_TRANSPORT_SERIAL=1
  -DPUKAAR_SIM=1
  '-DPUKAAR_FW="pukaar-gauge-3.0.0-sim"'

; The rain node (spec 3.2 "Rain node R"): the gauge's board and firmware with no level sensor.
[env:rain_node]
extends = esp32
build_src_filter = +<gauge_v3/>
build_flags =
  ${esp32.build_flags}
  -DPUKAAR_TRANSPORT_MQTT=1
  -DPUKAAR_RAIN_NODE=1
  '-DPUKAAR_FW="pukaar-rain-0.1.0"'

; The pradhan's box (spec 3.3, 7.2): the siren's LilyGO board, an E22, a MAX98357A I2S amp, level
; LEDs, buttons A B C D and the key switch. Always on: LoRa RX, MQTT, the box shadow.
[env:pradhan_box]
extends = esp32
build_src_filter = +<pradhan_box/>
build_flags =
  ${esp32.build_flags}
  -DPUKAAR_TRANSPORT_MQTT=1
  '-DPUKAAR_FW="pukaar-box-0.1.0"'

; The LoRa relay (spec 3.4, 7.3): a Heltec WiFi LoRa 32 V3 (ESP32-S3 + a bare SX1262 through
; RadioLib, MIT). No cell modem, no keys but its own: it forwards frames it cannot forge.
[env:lora_relay]
extends = esp32
board = heltec_wifi_lora_32_V3
build_src_filter = +<lora_relay/>
lib_deps =
  ${esp32.lib_deps}
  jgromes/RadioLib@7.1.2
build_flags =
  ${esp32.build_flags}
  '-DPUKAAR_FW="pukaar-relay-0.1.0"'

; ---------------------------------------------------------------- host unit tests
[env:native]
platform = native@1.2.1
test_framework = unity
test_filter = native/*
lib_ignore = pukaar_hal
build_src_filter = -<*>
build_flags =
  ${env.build_flags}
  -DPUKAAR_NATIVE=1
  -Wextra
  -Wno-unused-parameter
  '-DPUKAAR_VECTORS_PATH="test/vectors/protocol_vectors.json"'
