[project]
name = "Pukaar"
version = "0.1.0"
description = "Pukaar MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
    "httpx",
    "boto3>=1.43.110",
    "strands-agents>=1.59.0",
    "cedarpy>=4.12.1",
    "python-ulid>=4.0.1",
    "pyjwt[crypto]>=2.15.1",
]

[project.optional-dependencies]
dev = [
    "moto[dynamodb,lambda,s3,ssm,stepfunctions]>=5.2.3",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
