# Dev-only compose for Pukaar.
# Brings up the FastAPI backend and an optional local Ollama runtime
# serving Pukaar AI (E2B for text, vision-capable variant for multimodal).
# IMPORTANT: pukaar-model:2b is text-only (no vision adapter); a vision-capable
# variant (e.g. pukaar-model:26b or pukaar-ai3:4b) MUST be used for multimodal analysis,
# otherwise Ollama returns 500 "missing data required for image input" and
# Pukaar falls back to the deterministic OpenCV path.
# Frontend and Android are out of scope here.
#
# Usage:
#   docker compose up backend                  # backend only
#   docker compose --profile llm up            # backend + ollama
#
# The backend image is built from backend/ using its own pyproject.toml.

services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        image: Pukaar-backend:dev
        container_name: pukaar-backend
        working_dir: /app
        environment:
            PYTHONPATH: src
            PUKAAR_DATA_DIR: /data
            PUKAAR_LLM_ENABLED: "true"
            PUKAAR_LLM_BASE_URL: http://ollama:11434/v1
            # Central reasoning + actuator tool-calling. pukaar-model:2b does NOT
            # support /api/chat tools (Ollama responds 400 "does not support tools"),
            # so use the vision-and-tools capable variant for fusion + actuators.
            PUKAAR_LLM_MODEL: pukaar-model:26b
            PUKAAR_LLM_API_KEY: ollama
            PUKAAR_MULTIMODAL_ENABLED: "true"
            PUKAAR_MULTIMODAL_BASE_URL: http://ollama:11434/v1
            PUKAAR_MULTIMODAL_MODEL: pukaar-model:26b
        volumes:
            - ./backend:/app
            - pukaar-data:/data
        ports:
            - "8000:8000"
        command: >
            uvicorn Pukaar.main:app
            --host 0.0.0.0 --port 8000 --reload
        depends_on:
            - ollama

    ollama:
        image: ollama/ollama:latest
        container_name: pukaar-ollama
        profiles: ["llm"]
        ports:
            - "11434:11434"
        volumes:
            - ollama-models:/root/.ollama
        # Pull the model once after first start:
        #   docker exec pukaar-ollama ollama pull pukaar-model:2b   # text LLM
        #   docker exec pukaar-ollama ollama pull pukaar-model:26b   # multimodal (vision)

volumes:
    pukaar-data:
    ollama-models:
