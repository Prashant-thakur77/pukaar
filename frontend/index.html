<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#eef5fb" />
    <title>Pukaar पुकार · flood warnings for Himalayan villages</title>
    <meta name="description" content="The call that reaches the village before the river does. नदी से पहले गाँव तक पहुँचने वाली पुकार।" />
    <script>
      try {
        var t = localStorage.getItem('pukaar.theme');
        if (t !== 'light' && t !== 'dark' && /^\/(?:$|village\/|report|t\/|safe\/|live)/.test(location.pathname)) t = 'light';
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        if (/^\/(console|login)(\/|$)/.test(location.pathname)) document.documentElement.setAttribute('data-console', '');
      } catch (e) {}
    </script>
    <!-- pk:boot -->
    <noscript><link rel="stylesheet" href="/noscript.css" /></noscript>
  </head>
  <body>
    <!-- Without JavaScript (every page, /report included): the emergency number first, then what still works.
         No report form here: the CSP's form-action 'self' blocks a post to the API host, and the API answers in JSON. -->
    <noscript>
      <main class="nojs" lang="hi">
        <p class="nojs-brand">पुकार <span lang="en">Pukaar</span></p>
        <h1>बाढ़ या कोई ख़तरा? अभी 112 पर कॉल करें।</h1>
        <p lang="en">Flood or any danger? Call 112 now.</p>
        <a class="nojs-call" href="tel:112">112 पर कॉल करें · <span lang="en">Call 112</span></a>
        <h2>सूचना भेजने का फ़ॉर्म JavaScript के बिना नहीं चलता <span lang="en">· The report form needs JavaScript</span></h2>
        <p>ब्राउज़र में JavaScript चालू करके पेज फिर खोलें, या कोई दूसरा ब्राउज़र आज़माएँ।</p>
        <p lang="en">Turn JavaScript on and reload, or open this page in another browser.</p>
        <h2>Telegram पर चेतावनी पाएँ <span lang="en">· Alerts on Telegram</span></h2>
        <p>@PukaarRescuebot को <code lang="en">/start</code> और अपने गाँव का नाम भेजें, जैसे <code lang="en">/start thunag</code>।</p>
        <p lang="en">Send <code>/start</code> and your village to @PukaarRescuebot, for example <code>/start thunag</code>.</p>
        <a class="nojs-tg" href="https://t.me/PukaarRescuebot">Telegram: @PukaarRescuebot</a>
        <!-- Filled in at build time by status-page.ts: each village's level then, and live plain-text links. -->
        <!-- status:levels -->
        <!-- status:links -->
        <a class="nojs-link" href="/status.html">बिना JavaScript वाला स्थिति पेज <span lang="en">· Status page without JavaScript</span></a>
      </main>
    </noscript>
    <!-- The boot painter's page (boot-plugin.ts, src/boot/boot.ts). Before any script: the header with 112, painted
         by the inlined critical CSS. The painter then draws the answer here; React renders into #root (hidden while
         this exists) and removes it once its page has the answer (src/boot/handoff.ts). -->
    <div id="pk-boot">
      <header class="hd">
        <div class="hd-inner">
          <a href="/" class="hd-brand"><span class="wordmark"><span lang="hi" class="wm-hi">पुकार</span><span class="wm-en" lang="en">Pukaar</span></span></a>
          <div class="hd-tools"><a href="tel:112" class="call112" aria-label="आपातकाल 112 पर कॉल करें"><span lang="hi" class="c112-hi">आपातकाल</span><span class="c112-num">112</span></a></div>
        </div>
      </header>
      <main class="page"><p class="boot-wait" lang="hi">पुकार खुल रहा है… <span lang="en">Opening Pukaar…</span></p></main>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
