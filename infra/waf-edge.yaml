AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Pukaar prod: the AWS WAF web ACL for the CloudFront distribution in front of the API (stack
  pukaar-<stage>-waf-edge, us-east-1 only). AWS WAF cannot be attached to an API Gateway HTTP API, so
  infra/template.yaml puts CloudFront in front of the API on prod and attaches this ACL by its ARN
  (parameter EdgeWebAclArn). A CLOUDFRONT-scope web ACL can only be made in us-east-1, while prod runs in
  ap-south-1: hence this separate stack. Deploy with `make waf-edge` (docs/DEPLOY.md, "AWS WAF on prod").

# AWS WAF bills by the month (a web ACL and each rule) whatever the traffic, so it exists on prod only.
# backend/tests/test_template_safety.py checks that every web ACL carries this condition.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]{1,12}$"
  ReportsPerIpPer5Min:
    Type: Number
    Default: 100
    MinValue: 10
    MaxValue: 2000
    Description: POST /reports from one IP in any 5 minutes before WAF answers 429 (the app holds a burst for an officer long before).
  RequestsPerIpPer5Min:
    Type: Number
    Default: 2000
    MinValue: 100
    MaxValue: 100000
    Description: All other API requests from one IP in any 5 minutes (voice and Telegram webhooks are not counted).

Rules:
  EdgeAclInUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: A CLOUDFRONT-scope web ACL can only be created in us-east-1 (make waf-edge does this).

Conditions:
  IsProd: !Equals [!Ref Stage, prod]

Resources:
  EdgeWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: IsProd
    Properties:
      Name: !Sub pukaar-${Stage}-api-edge
      Description: Pukaar API behind CloudFront - per-IP rate limits and AWS managed rules.
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub pukaar-${Stage}-api-edge
      CustomResponseBodies:
        slow-down:
          ContentType: APPLICATION_JSON
          Content: '{"detail":{"code":"rate_limited","message_en":"Too many requests from this network. Please try again in a few minutes.","message_hi":"इस नेटवर्क से बहुत अधिक अनुरोध। कृपया कुछ मिनट बाद फिर कोशिश करें।"}}'
      Rules:
        - Name: aws-ip-reputation
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-ip-reputation }
        - Name: aws-common
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # Counted, not blocked: a villager's report carries a photo or voice note of up to 4 MB (the
              # rule blocks bodies over 8 KB), and gauges and the voice provider may send no User-Agent.
              RuleActionOverrides:
                - { Name: SizeRestrictions_BODY, ActionToUse: { Count: {} } }
                - { Name: NoUserAgent_HEADER, ActionToUse: { Count: {} } }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: aws-common }
        - Name: reports-per-ip
          Priority: 2
          Action:
            Block: { CustomResponse: { ResponseCode: 429, CustomResponseBodyKey: slow-down } }
          Statement:
            RateBasedStatement:
              Limit: !Ref ReportsPerIpPer5Min
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: STARTS_WITH
                        SearchString: /reports
                        TextTransformations: [{ Priority: 0, Type: NONE }]
                    - ByteMatchStatement:
                        FieldToMatch: { Method: {} }
                        PositionalConstraint: EXACTLY
                        SearchString: POST
                        TextTransformations: [{ Priority: 0, Type: NONE }]
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: reports-per-ip }
        - Name: requests-per-ip
          Priority: 3
          Action:
            Block: { CustomResponse: { ResponseCode: 429, CustomResponseBodyKey: slow-down } }
          Statement:
            RateBasedStatement:
              Limit: !Ref RequestsPerIpPer5Min
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              # The voice provider and Telegram call the webhooks from a few addresses, thousands of times
              # in a big delivery: never rate-limit them here (each request is signed and checked in the app).
              ScopeDownStatement:
                NotStatement:
                  Statement:
                    OrStatement:
                      Statements:
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: /voice/
                            TextTransformations: [{ Priority: 0, Type: NONE }]
                        - ByteMatchStatement:
                            FieldToMatch: { UriPath: {} }
                            PositionalConstraint: STARTS_WITH
                            SearchString: /telegram/
                            TextTransformations: [{ Priority: 0, Type: NONE }]
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: requests-per-ip }

Outputs:
  WebAclArn:
    Condition: IsProd
    Description: Pass to the prod stack as EdgeWebAclArn (EDGE_WEB_ACL_ARN in .env.deploy.prod.local)
    Value: !GetAtt EdgeWebAcl.Arn
