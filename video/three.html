<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pukaar architecture</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=block"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #070b1d; font-family: Inter, sans-serif; }
      canvas { display: block; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      .lab { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; transition: opacity 450ms cubic-bezier(0.16, 1, 0.3, 1), transform 450ms cubic-bezier(0.16, 1, 0.3, 1); }
      .lab b { display: block; font: 800 27px/1.1 Inter, sans-serif; color: #eef1fb; text-shadow: 0 2px 10px #070b1d; }
      .lab span { display: block; font: 500 19px/1.3 "JetBrains Mono", monospace; color: #b8c0de; margin-top: 4px; opacity: 0; transition: opacity 300ms; }
      .lab.dim { opacity: 0.28; }
      .lab.on { transform: translate(-50%, -112%) scale(1.12); }
      .lab.on b { color: #ffc35c; }
      .lab.on span, .lab.keep span { opacity: 1; }
      #title { position: absolute; left: 90px; top: 60px; font: 700 22px/1 "JetBrains Mono", monospace; letter-spacing: 0.22em; text-transform: uppercase; color: #b8c0de; }
      #title b { display: block; margin-top: 14px; font: 800 52px/1 Inter, sans-serif; letter-spacing: -0.02em; text-transform: none; color: #eef1fb; }
    </style>
    <script type="importmap">{ "imports": { "three": "https://video.pukaar.local/three.module.js" } }</script>
  </head>
  <body>
    <div id="title">Architecture · AWS us-east-1<b id="title-b">One alert, end to end</b></div>
    <div id="labels"></div>
    <script type="module">
      import * as THREE from "three";
      const DATA = /*__DATA__*/ null;
      // nodes: {id, name, detail, x, z, kind: "aws" | "ext" | "phone"}; edges: [from, to]; steps: [[node ids lit], ...]
      const W = 1920, H = 1080;
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.prepend(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070b1d);
      scene.fog = new THREE.FogExp2(0x070b1d, 0.022);
      const cam = new THREE.PerspectiveCamera(34, W / H, 0.1, 200);
      scene.add(new THREE.HemisphereLight(0xb8c0de, 0x070b1d, 1.1));
      const key = new THREE.DirectionalLight(0xffffff, 1.6);
      key.position.set(-6, 14, 8);
      scene.add(key);

      // the platform: a dark slab with a faint grid, like the app's night palette
      const slab = new THREE.Mesh(
        new THREE.BoxGeometry(26, 0.5, 15),
        new THREE.MeshStandardMaterial({ color: 0x131a3a, roughness: 0.9 }),
      );
      slab.position.y = -0.25;
      scene.add(slab);
      const grid = new THREE.GridHelper(26, 26, 0x2f3c74, 0x1e2852);
      grid.position.y = 0.01;
      grid.scale.z = 15 / 26;
      scene.add(grid);

      const AWS = 0xf5a524, EXT = 0x4a5aa0, PHONE = 0x2f9e6e;
      const nodes = new Map();
      const labels = document.getElementById("labels");
      for (const n of DATA.nodes) {
        const h = n.kind === "phone" ? 1.6 : 1.1;
        const geo = n.kind === "phone" ? new THREE.BoxGeometry(0.9, h, 0.18) : new THREE.BoxGeometry(1.7, h, 1.7);
        const color = n.kind === "aws" ? AWS : n.kind === "phone" ? PHONE : EXT;
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1, emissive: color, emissiveIntensity: 0.05, transparent: true });
        const m = new THREE.Mesh(geo, mat);
        m.position.set(n.x, h / 2, n.z);
        scene.add(m);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xeef1fb, transparent: true, opacity: 0.35 }));
        m.add(edges);
        const el = document.createElement("div");
        el.className = "lab";
        el.innerHTML = `<b>${n.name}</b><span>${n.detail ?? ""}</span>`;
        labels.appendChild(el);
        nodes.set(n.id, { n, m, mat, edges, el, h, lift: 0, glow: 0.05, alpha: 1 });
      }

      // edges as thin tubes, with a pulse that runs along the active ones
      const links = DATA.edges.map(([a, b]) => {
        const A = nodes.get(a).m.position, B = nodes.get(b).m.position;
        const p0 = new THREE.Vector3(A.x, 0.3, A.z), p1 = new THREE.Vector3(B.x, 0.3, B.z);
        const mid = p0.clone().lerp(p1, 0.5); mid.y = 0.3 + p0.distanceTo(p1) * 0.12;
        const curve = new THREE.QuadraticBezierCurve3(p0, mid, p1);
        const mat = new THREE.MeshBasicMaterial({ color: 0x4a5aa0, transparent: true, opacity: 0.55 });
        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.035, 8), mat);
        scene.add(tube);
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffc35c }));
        dot.visible = false;
        scene.add(dot);
        return { a, b, curve, mat, dot, t: Math.random() };
      });

      let active = new Set(), seen = new Set(), step = -1;
      const camGoal = { x: 0, z: 0, dist: 25 }, camNow = { x: 0, z: 0, dist: 25 };
      window.__arch = {
        focus(k) {
          step = k;
          const s = DATA.steps[k];
          active = new Set(s.on);
          s.on.forEach((id) => seen.add(id));
          // the camera eases toward the lit nodes
          const ps = s.on.map((id) => nodes.get(id).m.position);
          camGoal.x = ps.reduce((a, p) => a + p.x, 0) / ps.length;
          camGoal.z = ps.reduce((a, p) => a + p.z, 0) / ps.length;
          camGoal.dist = s.dist ?? 17;
          if (s.title) document.getElementById("title-b").textContent = s.title;
        },
        all() {
          step = -1; active = new Set(DATA.nodes.map((n) => n.id));
          camGoal.x = 0; camGoal.z = 0; camGoal.dist = 25;
        },
      };
      window.__prepare = async () => {
        await document.fonts.ready;
        window.__arch.all();
      };

      const v = new THREE.Vector3();
      let last = performance.now(), t0 = last;
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        const T = (now - t0) / 1000;
        const ease = 1 - Math.exp(-dt * 3.2);
        camNow.x += (camGoal.x - camNow.x) * ease;
        camNow.z += (camGoal.z - camNow.z) * ease;
        camNow.dist += (camGoal.dist - camNow.dist) * ease;
        const ang = -0.55 + Math.sin(T * 0.08) * 0.12; // a slow drift so the scene never sits still
        cam.position.set(camNow.x + Math.sin(ang) * camNow.dist, camNow.dist * 0.62, camNow.z + Math.cos(ang) * camNow.dist);
        cam.lookAt(camNow.x, 0.4, camNow.z);
        for (const o of nodes.values()) {
          const on = active.has(o.n.id);
          const goal = on ? (step >= 0 ? 0.55 : 0) : 0;
          o.lift += (goal - o.lift) * ease;
          o.m.position.y = o.h / 2 + o.lift;
          o.mat.emissiveIntensity += ((on && step >= 0 ? 0.75 : 0.06) - o.mat.emissiveIntensity) * ease;
          o.mat.opacity += ((on || step < 0 ? 1 : seen.has(o.n.id) ? 0.55 : 0.32) - o.mat.opacity) * ease;
          o.edges.material.opacity = o.mat.opacity * 0.4;
          v.set(o.m.position.x, o.m.position.y + o.h / 2 + 0.55, o.m.position.z).project(cam);
          o.el.style.left = `${((v.x + 1) / 2) * W}px`;
          o.el.style.top = `${((1 - v.y) / 2) * H}px`;
          o.el.className = "lab" + (on && step >= 0 ? " on" : "") + (!on && step >= 0 ? " dim" : "");
        }
        for (const l of links) {
          const on = active.has(l.a) && active.has(l.b) && step >= 0;
          l.mat.color.setHex(on ? 0xf5a524 : 0x4a5aa0);
          l.mat.opacity = on ? 0.95 : step >= 0 ? 0.25 : 0.55;
          l.dot.visible = on || step < 0;
          l.t = (l.t + dt * (on ? 0.7 : 0.35)) % 1;
          l.dot.position.copy(l.curve.getPoint(l.t));
        }
        renderer.render(scene, cam);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
