<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pukaar pitch compositor</title>
    <!-- The pitch video's compositor. video/lib/compose.mjs loads this page with the whole timeline (DATA), calls
         __init() once, then __render(t) for every frame and screenshots it. Every layer is a pure function of t: no
         CSS transitions, no timers, so any frame renders the same on any run. The look follows the live site
         (frontend/src/theme.css): Tiro Devanagari Hindi for display, Inter for text, the water-blue palette. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+Devanagari:wght@500;600;700&display=block"
      rel="stylesheet"
    />
    <style>
      @font-face { font-family: "Tiro Devanagari Hindi"; font-style: normal; font-weight: 400; font-display: block;
        src: url(/frontend/src/fonts/tiro-devanagari-hindi-devanagari-400.woff2) format("woff2");
        unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
      @font-face { font-family: "Tiro Devanagari Hindi"; font-style: normal; font-weight: 400; font-display: block;
        src: url(/frontend/src/fonts/tiro-devanagari-hindi-latin-400.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Tiro Devanagari Hindi"; font-style: italic; font-weight: 400; font-display: block;
        src: url(/frontend/src/fonts/tiro-devanagari-hindi-latin-400-italic.woff2) format("woff2"); }

      /* backgrounds */

      .bg-deep { background: radial-gradient(1200px 800px at 30% 0%, #0f2a44 0%, #06111f 70%); }

      .kb { display: flex; gap: 8px; max-width: 360px; }
      .kb .btn { flex: 1; text-align: center; border-radius: 12px; background: rgba(255,255,255,.92); border: 1px solid #c9d8e5; padding: 12px 8px; font: 700 19px/1.2 var(--hi); color: #11679e; display: flex; align-items: center; justify-content: center; gap: 8px; }
      .kb .btn.done { background: #dff5ea; border-color: #8fd0b0; color: #0f6443; }
      .toast { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); background: rgba(11,31,51,.88); color: #fff; font: 600 18px/1.3 var(--hi); padding: 12px 18px; border-radius: 14px; white-space: nowrap; }

      .lock { position: absolute; inset: 0; background: radial-gradient(500px 500px at 50% 0%, #1d4466, #06111f 75%); }

      .lock .date { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font: 600 21px/1 var(--sans); color: #9cc0dc; }
      .notif { position: absolute; left: 14px; right: 14px; top: 300px; border-radius: 26px; background: rgba(234, 244, 251, 0.94); padding: 18px 18px 14px; color: #0b1f33; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
      .notif .hd { display: flex; align-items: center; gap: 10px; font: 600 15px/1 var(--sans); color: #557089; }

      .plabel { position: absolute; font: 600 20px/1.3 var(--sans); color: #eaf4fb; text-align: center; }
      .plabel small { display: block; font: 500 16px/1.3 var(--mono); color: #9cc0dc; margin-top: 4px; }

      /* timeline, chart, terminal, roadmap, captions, chapters */
      .tl-axis { position: absolute; height: 6px; border-radius: 3px; background: rgba(156, 192, 220, 0.25); }

      .term pre .k { color: #8ad0ff; } .term pre .v { color: #ffd479; } .term pre .c { color: #6c8aa6; } .term pre .p { color: #7ee2a8; }

  <body>
    <div id="stage"></div>
    <div id="flash"></div>
    <div id="caps"></div>
    <div id="chrome"><div class="ticks"></div><div class="prog"></div><div class="chap"></div></div>
    <script type="module">
      import * as THREE from "three";
      const DATA = window.__DATA;
      const W = 1920, H = 1080;
      const $stage = document.getElementById("stage");
      const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
      /** "plain *emphasis* plain": stars become the site's italic blue emphasis */
      const md = (s) => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>").replace(/\n/g, "<br>");
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, p) => a + (b - a) * p;
      // the signature ease, cubic-bezier(0.16, 1, 0.3, 1), solved numerically
      function bez(x1, y1, x2, y2) {

            o.lab.style.left = `${((v.x + 1) / 2) * W}px`;
            o.lab.style.top = `${((1 - v.y) / 2) * H}px`;
            o.lab.style.opacity = focus ? 0.3 + a * 0.7 : 0.95;
            o.lab.style.transform = `translate(-50%, -100%) scale(${focus ? 1 + a * 0.12 : 1})`;
            o.lab.querySelector("span").style.opacity = focus ? a : 0.85;
            o.lab.querySelector("b").style.color = focus && a > 0.5 ? "#8ad0ff" : "#eaf4fb";
          }
          for (const l of el.__links) {
            const lit2 = (cur ? on.has(l.a) && on.has(l.b) : true);
            l.mat.color.setHex(lit2 && cur ? 0x4fb3ff : 0x3b6b93);
            l.mat.opacity = lit2 ? 0.9 : 0.2;
            l.dot.visible = lit2;
            l.dot.position.copy(l.curve.getPoint((l.ph + u * (cur ? 0.7 : 0.35)) % 1));
          }
          el.__title.textContent = cur?.title ?? L.title ?? "One alert, end to end";
          el.__r.render(el.__s, cam);
          el.style.opacity = env(u, d, 0.5, 0.4);
        },
      };

      // ------------------------------------------------------------------ the timeline
      const layers = DATA.layers.map((L, i) => {
        const el = document.createElement("div");
        el.className = "L";
        el.style.zIndex = String(L.z ?? i + 1);
        $stage.appendChild(el);
        return { L, el, built: false };
      });
      function build(o) {
        if (o.built) return;
        const f = T[o.L.type];
        if (!f) throw new Error(`unknown layer type ${o.L.type}`);
        f.build(o.L, o.el);
        o.built = true;
      }
      const capsEl = document.getElementById("caps");
      const chrome = document.getElementById("chrome");
      chrome.querySelector(".ticks").innerHTML = DATA.chapters.map((c) => `<i style="left:${(c.from / DATA.total) * W}px"></i>`).join("");

      window.__init = async () => {
        await document.fonts.ready;
        for (const f of ["400 40px 'Tiro Devanagari Hindi'", "italic 400 40px 'Tiro Devanagari Hindi'", "600 40px Inter", "700 40px 'Noto Serif'", "700 40px 'Noto Serif Devanagari'", "500 40px 'JetBrains Mono'", "600 40px 'Noto Sans Devanagari'"]) await document.fonts.load(f, "पुकार Pukaar");
        for (const o of layers) if (o.L.type === "arch") build(o);
        return layers.length;
      };

      window.__render = async (t) => {
        for (const o of layers) {
          const { L, el } = o;
          const live = t >= L.from && t < L.to;
          if (live) {
            build(o);
            if (!el.classList.contains("on")) el.classList.add("on");
            T[L.type].update(L, el, t - L.from, L.to - L.from);
          } else if (el.classList.contains("on")) el.classList.remove("on");
          // build a little ahead so stills are decoded before they are needed
          if (!o.built && t >= L.from - 2) build(o);
        }
        // captions
        const c = DATA.captions.find((x) => t >= x.from && t < x.to);
        if (c) {
          if (capsEl.__key !== c.key) { capsEl.innerHTML = `<div class="box"${/[ऀ-ॿ]/.test(c.text) ? ' lang="hi"' : ""}>${c.lines.map(esc).join("<br>")}</div>`; capsEl.__key = c.key; }
          capsEl.style.opacity = clamp((t - c.from) / 0.12) * clamp((c.to - t) / 0.12);
        } else { capsEl.innerHTML = ""; capsEl.__key = null; }
        // chrome: progress, chapter label
        const show = DATA.chrome.some((r) => t >= r[0] && t < r[1]);
        const fadeC = DATA.chrome.reduce((a, r) => Math.max(a, clamp((t - r[0]) / 0.5) * clamp((r[1] - t) / 0.5)), 0);
        chrome.style.opacity = show ? fadeC : 0;
        chrome.querySelector(".prog").style.width = `${(t / DATA.total) * W}px`;
        const ch = [...DATA.chapters].reverse().find((x) => t >= x.from);
        if (ch && chrome.__ch !== ch.label) { chrome.querySelector(".chap").innerHTML = `<span class="wm">पुकार</span><span class="n">${String(ch.n).padStart(2, "0")}</span><span>${esc(ch.label)}</span>`; chrome.__ch = ch.label; }
        chrome.classList.toggle("light", DATA.lightRanges.some((r) => t >= r[0] && t < r[1]));
        // flashes (lightning, a cut on a hit)
        const fl = DATA.flashes.reduce((a, f) => { const u = t - f.t; return u < 0 || u > f.d ? a : Math.max(a, f.a * (u < 0.04 ? u / 0.04 : Math.exp(-(u - 0.04) / (f.d / 3)))); }, 0);
        document.getElementById("flash").style.opacity = fl;
        if (pending.length) { await Promise.all(pending.splice(0)); }
        // two frames, so the compositor has painted every change before the screenshot
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => r())));
        return true;
      };
    </script>
  </body>
</html>
