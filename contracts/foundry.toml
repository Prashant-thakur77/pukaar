# Pukaar Raahat contracts (PLAN.md §2.2). Solidity 0.8.26, OpenZeppelin 5, no proxies.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol writes the deployed addresses; the tests read the household fixture built by households.py.
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 512

[dependencies]
"@openzeppelin-contracts" = "5.1.0"
forge-std = "1.9.4"

[soldeer]
remappings_generate = false
remappings_location = "txt"
recursive_deps = false
