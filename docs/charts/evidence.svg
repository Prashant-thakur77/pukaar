<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><title>Six sourced numbers on early warning, Himachal and Hindi</title><rect width="960" height="470" rx="18" fill="#f4ece4"/><text x="36.0" y="44.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#7a5a14" text-anchor="start" letter-spacing="2.4">WHY EARLY WARNING, WHY HIMACHAL, WHY HINDI</text><text x="36.0" y="84.0" font-family="Anton, 'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="34" font-weight="400" fill="#0c0c08" text-anchor="start" letter-spacing="0.5">THE CASE IN SIX SOURCED NUMBERS</text><rect x="36.0" y="112" width="284.0" height="150" rx="16" fill="#0c0c08"/><text x="56.0" y="174.0" font-family="Anton, 'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="50" font-weight="400" fill="#f4ece4" text-anchor="start" >~6×</text><text x="56.0" y="202.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f4ece4" text-anchor="start" >nearly six times the disaster mortality</text><text x="56.0" y="218.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f4ece4" text-anchor="start" >ratio where early-warning coverage is</text><text x="56.0" y="234.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f4ece4" text-anchor="start" >limited</text><text x="56.0" y="250.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#c8b488" text-anchor="start" letter-spacing="1">WMO · GLOBAL STATUS OF MHEWS 2024</text><rect x="338.0" y="112" width="284.0" height="150" rx="16" fill="#d4ac58"/><text x="358.0" y="174.0" font-family="Anton, 'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="50" font-weight="400" fill="#0c0c08" text-anchor="start" >30%</text><text x="358.0" y="202.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0c0c08" text-anchor="start" >less damage from just 24 hours of</text><text x="358.0" y="218.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0c0c08" text-anchor="start" >warning of a storm or heatwave</text><text x="358.0" y="250.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#3a2f16" text-anchor="start" letter-spacing="1">GLOBAL COMMISSION ON ADAPTATION · 2019</text><rect x="640.0" y="112" width="284.0" height="150" rx="16" fill="#0c0c08"/><text x="660.0" y="174.0" font-family="Anton, 'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="50" font-weight="400" fill="#f4ece4" text-anchor="start" >10×</text><text x="660.0" y="202.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f4ece4" text-anchor="start" >early warning systems save lives and</text><text x="660.0" y="218.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f4ece4" text-anchor="start" >assets worth at least ten times their</text><text x="660.0" y="234.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f4ece4" text-anchor="start" >cost</text><text x="660.0" y="250.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#c8b488" text-anchor="start" letter-spacing="1">GLOBAL COMMISSION ON ADAPTATION · 2019</text><rect x="36.0" y="280" width="284.0" height="150" rx="16" fill="#d4ac58"/><text x="56.0" y="342.0" font-family="Anton, 'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="50" font-weight="400" fill="#0c0c08" text-anchor="start" >500+</text><text x="56.0" y="370.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0c0c08" text-anchor="start" >people lost their lives in Himachal</text><text x="56.0" y="386.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0c0c08" text-anchor="start" >Pradesh's 2023 monsoon (45 cloudbursts,</text><text x="56.0" y="402.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0c0c08" text-anchor="start" >83 flash floods)</text><text x="56.0" y="418.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#3a2f16" text-anchor="start" letter-spacing="1">HP GOVT / HPSDMA · PDNA MONSOON 2023</text><rect x="338.0" y="280" width="284.0" height="150" rx="16" fill="#0c0c08"/><text x="358.0" y="342.0" font-family="Anton, 'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="50" font-weight="400" fill="#f4ece4" text-anchor="start" >₹8,668 cr</text><text x="358.0" y="370.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f4ece4" text-anchor="start" >recovery needs for sectoral damage in</text><text x="358.0" y="386.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f4ece4" text-anchor="start" >Himachal after the 2023 monsoon</text><text x="358.0" y="418.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#c8b488" text-anchor="start" letter-spacing="1">HP GOVT / HPSDMA · PDNA MONSOON 2023</text><rect x="640.0" y="280" width="284.0" height="150" rx="16" fill="#d4ac58"/><text x="660.0" y="342.0" font-family="Anton, 'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="50" font-weight="400" fill="#0c0c08" text-anchor="start" >85.9%</text><text x="660.0" y="370.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0c0c08" text-anchor="start" >of Himachal Pradesh's people are Hindi</text><text x="660.0" y="386.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0c0c08" text-anchor="start" >speakers (Census 2011 language group)</text><text x="660.0" y="418.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#3a2f16" text-anchor="start" letter-spacing="1">CENSUS OF INDIA 2011 · C-16 LANGUAGE</text><text x="36.0" y="456.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#5e5848" text-anchor="start" >Sources linked in the README and in data/evidence.json (checked 2026-10-11).</text></svg>
